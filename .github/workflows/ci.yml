name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: menu
          POSTGRES_PASSWORD: menu
          POSTGRES_DB: menu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://menu:menu@localhost:5432/menu_test
      BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef0123456789abcdef
      # robots.ts/sitemap.ts build against this origin — CI has no live host.
      NEXT_PUBLIC_APP_URL: https://example.com
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests (unit + tenancy-isolation integration)
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: menu
          POSTGRES_PASSWORD: menu
          POSTGRES_DB: menu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://menu:menu@localhost:5432/menu_e2e
      BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef0123456789abcdef
      # Baked into the build; the e2e server runs on this exact origin.
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm exec drizzle-kit migrate
      - name: Seed demo restaurant
        run: pnpm seed
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm e2e
