# Base44 development environment: local Postgres + live-reload Next.js dev server.
# The web service runs the cloned source via a bind mount — no app image to rebuild.
services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu_dev_password
      POSTGRES_DB: menu
    volumes:
      - menu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: node:22
    restart: on-failure
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - menu-node-modules:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://menu:menu_dev_password@db:5432/menu
      # Skip git hook installation inside the sandbox/CI (husky is for local dev machines)
      - HUSKY=0
      # Base44 preview plumbing (empty outside the sandbox)
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    env_file:
      # Platform-managed secrets (e.g. BETTER_AUTH_SECRET) — must stay last.
      - path: /run/base44/app.env
        required: false
    command:
      - sh
      - -ec
      - |
        corepack enable
        pnpm install --frozen-lockfile
        exec pnpm dev
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

volumes:
  menu-pgdata:
  menu-node-modules:
