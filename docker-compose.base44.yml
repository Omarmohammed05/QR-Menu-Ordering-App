name: qr-menu

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    labels:
      base44.project: QR Menu DB
      base44.kind: infra
    environment:
      POSTGRES_USER: qrmenu
      POSTGRES_PASSWORD: qrmenu
      POSTGRES_DB: qrmenu
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrmenu -d qrmenu"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: node:22-bookworm
    restart: "no"
    labels:
      base44.project: QR Menu Migrations
      base44.kind: worker
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /run/base44/app.env
    environment:
      DATABASE_URL: postgres://qrmenu:qrmenu@db:5432/qrmenu
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        corepack enable
        pnpm install --no-frozen-lockfile
        pnpm db:migrate

  web:
    image: node:22-bookworm
    restart: on-failure
    labels:
      base44.project: QR Menu
      base44.kind: web
      base44.port: "3000"
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - /run/base44/app.env
    environment:
      DATABASE_URL: postgres://qrmenu:qrmenu@db:5432/qrmenu
      NEXT_TELEMETRY_DISABLED: "1"
      BASE44_PREVIEW_MODE: "${BASE44_PREVIEW_MODE}"
      BASE44_PUBLIC_HOST_SUFFIX: "${BASE44_PUBLIC_HOST_SUFFIX}"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        corepack enable
        pnpm install --no-frozen-lockfile
        exec pnpm exec next dev -H 0.0.0.0 -p 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  db-data:
  web-node-modules:
